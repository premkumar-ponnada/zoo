
name: Deploy to Azure App Service

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes must not deploy to the same app at once (CI-07).
concurrency:
  group: "deploy-app-service"
  cancel-in-progress: false

jobs:
  build:
    name: Build deployment payload
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No install, test or build step: this repo has no dependencies, no test suite
      # and no build pipeline. It is hand-written HTML, one dependency-free JS file and
      # media assets. The "build" is selecting which of those files belong in
      # production — shipping the whole repo would send the Python generators in
      # build/ and the 7 MB demo video in docs/ to a web server that will never use
      # either.

      - name: Assemble site payload
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html scrub-engine.js site/
          cp -r assets site/
          echo "Payload contents:"
          find site -type f | sort
          echo "Payload size: $(du -sh site | cut -f1)"

      # Fail loudly here rather than deploying a page whose assets 404 in production.
      - name: Verify every referenced asset is present
        run: |
          set -euo pipefail
          missing=0
          grep -oE "assets/[A-Za-z0-9/.\_-]+" site/index.html | sort -u | while read -r ref; do
            if [ ! -f "site/$ref" ]; then
              echo "MISSING: $ref"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All referenced assets present."

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: site
          if-no-files-found: error